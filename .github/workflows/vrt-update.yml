name: VRT update

on:
  workflow_dispatch:

permissions:
  contents: read

# L1 公開。.env のない CI でも、ビルドが API のベースURLを読めるようにする。
# E2E では e2e/support/test.ts が、本物へのリクエストを見本の応答に差し替える
env:
  VITE_KOKKAI_API_BASE: https://kokkai.ndl.go.jp/api

jobs:
  vrt-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:vrt --update-snapshots
      - uses: actions/upload-artifact@v7
        with:
          name: vrt-snapshots
          path: e2e/vrt.spec.ts-snapshots/
          retention-days: 7
